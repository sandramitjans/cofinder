<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500&family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />
    <title>Cofinder</title>
    <script>
      // Atajos escritos como ruta (…/admin, …/resum, …/entrar) → la app usa «#admin», «#resum», «#entrar»
      (function () {
        var m = location.pathname.match(/^(.*\/)(admin|moderadora|resum|entrar)\/?$/i)
        if (m) history.replaceState(null, '', m[1] + '#' + m[2].toLowerCase())
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
